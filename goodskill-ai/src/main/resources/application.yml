server:
  port: 18077

spring:
  application:
    name: goodskill-ai
  ai:
    openai:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      embedding:
        enabled: false
      chat:
        completions-path: /chat/completions
        options:
          model: ${DEEPSEEK_MODEL:deepseek-flash}

---
spring:
  config:
    activate:
      on-profile: "!production"
    import:
      - optional:nacos:goodskill-common-connection.yml
      - optional:nacos:goodskill-common.yml
  cloud:
    nacos:
      username: nacos
      password: nacos
      server-addr: nacos:8848

---
spring:
  config:
    activate:
      on-profile: production
    import:
      - nacos:goodskill-common-production.yml
      - nacos:goodskill-ai-production.yml
  cloud:
    nacos:
      server-addr: ${GOODSKILL_NACOS_SERVER_ADDR}
      username: ${GOODSKILL_NACOS_USERNAME}
      password: ${GOODSKILL_NACOS_PASSWORD}
      discovery:
        namespace: ${GOODSKILL_NACOS_NAMESPACE}
      config:
        namespace: ${GOODSKILL_NACOS_NAMESPACE}
  ai:
    openai:
      api-key: ${GOODSKILL_AI_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: ${GOODSKILL_AI_MODEL}
logging:
  level:
    com.goodskill.ai: INFO
