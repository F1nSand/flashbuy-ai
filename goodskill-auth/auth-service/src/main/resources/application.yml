server:
  port: 19081

spring:
  application:
    name: goodskill-auth
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false
    username: root
    password: Password123
  flyway:
    ##是否开启自动升级表结构功能
    enabled: true
    baseline-on-migrate: true
    clean-disabled: true
    locations:
      - classpath:db/migration/mysql

logging:
  level:
    com.goodskill: debug

seata:
  enabled: false
  #1.4.2使用此配置禁用seata
  enable-auto-data-source-proxy: true
  application-id: goodskill-seata
  tx-service-group: my_test_tx_group
  config:
    type: nacos
    nacos:
      namespace: bca6fe13-8ddd-4721-b753-022fe3beabd8
      serverAddr: nacos:8848
      group: SEATA_GROUP
      username: nacos
      password: nacos

---
spring:
  config:
    activate:
      on-profile: "!production"
    import:
      - optional:nacos:goodskill-common-connection.yml
      - optional:nacos:goodskill-common.yml
  cloud:
    nacos:
      username: nacos
      password: nacos
      server-addr: nacos:8848

---
spring:
  config:
    activate:
      on-profile: production
    import:
      - nacos:goodskill-common-production.yml
      - nacos:goodskill-auth-production.yml
  cloud:
    nacos:
      server-addr: ${GOODSKILL_NACOS_SERVER_ADDR}
      username: ${GOODSKILL_NACOS_USERNAME}
      password: ${GOODSKILL_NACOS_PASSWORD}
      discovery:
        namespace: ${GOODSKILL_NACOS_NAMESPACE}
      config:
        namespace: ${GOODSKILL_NACOS_NAMESPACE}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${GOODSKILL_AUTH_DB_URL}
    username: ${GOODSKILL_AUTH_DB_USERNAME}
    password: ${GOODSKILL_AUTH_DB_PASSWORD}
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
    locations:
      - classpath:db/migration/production
goodskill:
  auth:
    browser-cookie-session: true
    login:
      max-attempts: ${GOODSKILL_AUTH_LOGIN_MAX_ATTEMPTS:5}
      window-seconds: ${GOODSKILL_AUTH_LOGIN_WINDOW_SECONDS:300}
      lock-seconds: ${GOODSKILL_AUTH_LOGIN_LOCK_SECONDS:900}
      cleanup-delay-ms: ${GOODSKILL_AUTH_LOGIN_CLEANUP_DELAY_MS:3600000}
    bootstrap-admin:
      username: ${GOODSKILL_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${GOODSKILL_BOOTSTRAP_ADMIN_PASSWORD:}
sa-token:
  token-name: access_token
  is-read-cookie: true
  is-read-header: false
  is-read-body: false
  is-write-header: false
  cookie:
    path: /
    secure: true
    http-only: true
    same-site: Lax
seata:
  enabled: false
logging:
  level:
    com.goodskill: INFO
